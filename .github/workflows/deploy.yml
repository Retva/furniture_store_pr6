name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Как в учебном окружении; на 3.50+ material.dart даёт массу info.
          flutter-version: "3.38.2"
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Format
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        env:
          # Задайте в Settings → Secrets and variables → Actions → Variables.
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          REPO="${{ github.event.repository.name }}"
          API_BASE_URL="${API_BASE_URL:-http://127.0.0.1:8090}"
          flutter build web --release \
            --no-wasm-dry-run \
            --base-href "/${REPO}/" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=DATA_SOURCE=api

      - name: SPA fallback for GitHub Pages
        run: cp build/web/index.html build/web/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
